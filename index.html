<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valtrigo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      #game {
        width: 100%;
        height: 100%;
      }

      /* Pantalla que queda al salir del juego (HU-05). Mismos colores que la interfaz del juego. */
      #farewell {
        display: none;
        height: 100%;
        margin: 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #1d2b1f;
        color: #f2f2f2;
        font-family: sans-serif;
        font-size: 24px;
        text-align: center;
      }

      #farewell.visible {
        display: flex;
      }

      #farewell p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="farewell">
      <p>Has salido de Valtrigo.</p>
      <p>Puedes cerrar esta pestaña.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
